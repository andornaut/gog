version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - copyloopvar
    - goconst
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G204 # subprocess launched with variable - git commands
        - G301 # directory permissions 0755 are standard and appropriate
        - G304 # file operations with user paths are the tool's purpose
        - G703 # path traversal - validating user paths is the tool's purpose
        - G706 # log injection - logging environment variables
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    rules:
      # Tests get a longer leash than the code they exercise: fixture literals
      # repeat by nature (goconst), helpers take parameters only some cases use
      # (unparam), and the untrusted input gosec warns about is input the test
      # wrote itself.
      - linters:
          - goconst
          - gosec
          - unparam
        path: _test\.go
      # errcheck stays narrow. Tearing down what a test set up is
      # fire-and-forget, and so is a write that cannot fail; a dropped error
      # anywhere else in a test is a test that passes without checking anything.
      # os.Setenv rather than t.Setenv because TestMain holds no *testing.T.
      - linters:
          - errcheck
        path: _test\.go
        text: Error return value of `([\w.]+\.(Close|Serve)|os\.(Remove|RemoveAll|Setenv)|fmt\.Fprint)` is not checked
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/andornaut/gog)
  exclusions:
    generated: lax
