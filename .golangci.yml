version: "2"
run:
  tests: true
linters:
  # Everything is on. What is off below only enforces layout or mandates
  # documentation, and each entry says which.
  default: all
  disable:
    # Blank-line placement, and where a return may sit relative to one.
    - wsl
    - wsl_v5
    - nlreturn
    - whitespace
    # Bans `if err := f(); err != nil`, which is the error idiom used here.
    - noinlineerr
    # Every struct literal must set every field, including its zero values.
    - exhaustruct
    # Minimum identifier length, and a ban on named returns.
    - varnamelen
    - nonamedreturns
    # Import allowlist. Nothing here vendors a dependency worth policing that way.
    - depguard
    # Every returned error wrapped, and every error a declared sentinel.
    - wrapcheck
    - err113
    # Numeric literals must be named constants.
    - mnd
    # Comments must end in a period; tests must live in a _test package;
    # exported methods must precede unexported ones; struct tags must follow
    # one naming scheme.
    - godot
    - testpackage
    - funcorder
    - tagliatelle
    # Size and complexity ceilings. Worth watching, not worth failing a build on.
    - cyclop
    - funlen
    - gocognit
    - nestif
    - lll
    # Package-level state, and t.Parallel() on every test.
    - gochecknoglobals
    - paralleltest
    # Bans fmt.Print. These are command line tools; printing is the interface.
    - forbidigo
    # Wants every exec.Command to carry a context. These are synchronous
    # command line tools with no cancellation story, so satisfying it would
    # mean context.Background() at every call site: ceremony, not cancellation.
    - noctx
    # init() is how cobra registers commands and their flags, and the ones here
    # say in a comment why a flag is registered where it is.
    - gochecknoinits
  enable:
    - bodyclose
    - copyloopvar
    - goconst
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    # A default clause handles the cases not named, which is how these switches
    # are written; without this the linter wants every case spelled out anyway.
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        - G204 # subprocess launched with variable - git commands
        - G301 # directory permissions 0755 are standard and appropriate
        - G304 # file operations with user paths are the tool's purpose
        - G703 # path traversal - validating user paths is the tool's purpose
    govet:
      disable:
        # Packs struct fields by size. These are CLIs and a broker, where no
        # struct is allocated often enough for the bytes to matter, and field
        # order is how a reader finds related fields together.
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    rules:
      # Tests get a longer leash than the code they exercise, but only where the
      # finding is about being a test: fixture literals repeat by nature
      # (goconst) and helpers take parameters only some cases use (unparam).
      - linters:
          - goconst
          - unparam
        path: _test\.go
      # gosec by rule rather than wholesale, so everything it checks still
      # applies to tests except the four that only describe a fixture: a file
      # written 0644 into a temp dir the test made (G306, G302, G301), and a
      # password spelled out in the fixture that is the point of the fixture
      # (G101).
      - linters:
          - gosec
        path: _test\.go
        text: G(101|301|302|306)
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/andornaut/gog)
  exclusions:
    generated: lax
