# This is a GoReleaser configuration for gog (Go Overlay Git)
version: 2

project_name: gog

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # macOS is Apple Silicon only: the last Intel Mac was discontinued in 2023
    # and macOS 26 is the final release supporting Intel.
    ignore:
      - goos: darwin
        goarch: amd64
    main: ./main.go
    binary: gog
    # -trimpath keeps the build machine's absolute paths out of the binary, and
    # -s -w drops the symbol table and DWARF. Declaring ldflags replaces
    # goreleaser's defaults rather than adding to them, so the version stamp has
    # to be restated here: without it a tagged binary reports the "dev" its
    # source declares. The dev build in release.yml passes the same pair without
    # the stamp, which is what makes a dev archive report dev.
    flags: [-trimpath]
    ldflags: ['-s -w -X github.com/andornaut/gog/internal/version.Version={{.Version}}']

archives:
  - formats: [tar.gz]
    # this name template makes the output compatible with many package managers
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
