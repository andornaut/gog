name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Called by the release workflow, so that nothing is published that this has
  # not passed. Workflows do not wait on each other, so a green Test run beside
  # a release says nothing about whether the release waited for it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Keyed by the calling workflow as well, so the run started by a push and the
# run the release workflow calls do not cancel each other.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Go
        if: runner.os == 'macOS'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker
        if: runner.os == 'Linux'
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: v29.9.3

      - name: Set up Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v4.4.1
        with:
          version: v0.38.2
          driver: docker

      - name: Build
        if: runner.os == 'Linux'
        run: make build

      - name: Run tests
        if: runner.os == 'Linux'
        run: make test

      - name: Run native macOS checks
        if: runner.os == 'macOS'
        run: make test-native

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.txt

  # A matrix leg reports as `Test (ubuntu-latest)`, a name that changes whenever
  # the matrix does, and a required check that stops reporting blocks every pull
  # request forever. This job reports under one stable name, so branch
  # protection has a single check to require no matter which platforms are
  # added.
  #
  # `always()` and not `!cancelled()`, which looks tidier and is a hole: a
  # cancelled run would skip this job, and GitHub counts a skipped required
  # check as passing, so an unverified commit becomes mergeable. Failing closed
  # costs a red check on runs that were cancelled anyway.
  test:
    name: Test
    needs: test-platform
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check that every platform passed
        run: '[ "${{ needs.test-platform.result }}" = success ]'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: v29.9.3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          version: v0.38.2
          driver: docker

      - name: Run lint gate
        run: make lint
