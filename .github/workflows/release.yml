name: Release

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
    # Release versions only, the same set protect-release-tags guards.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Write access is granted only to the jobs that create releases
permissions:
  contents: read

# Keyed on the branch rather than the ref, so the push event and the pull
# request event for one branch share a group instead of running the same checks
# twice. Qualified by the repository the branch lives in, since a fork names its
# branches itself: a pull request from a fork's main would otherwise share a
# group with a push to this one and cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Publishing waits on the scan as well: a release is a durable artifact, and
  # taking an attribution back off after one is cut means rewriting history that
  # has already been published. Called only where a release can follow, since
  # the scan workflow already runs on every push and pull request of its own
  # accord.
  attributions:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/ai-attributions.yml

  # Publishing waits on the same suite that guards main, rather than on the
  # build alone: something that compiles everywhere still ships whatever the
  # tests would have caught. Called only where a release can follow, since the
  # Test workflow already runs on every push and pull request of its own
  # accord, and the jobs below are gated the same way.
  test:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/test.yml

  build-platform:
    runs-on: ubuntu-latest

    # The platforms .goreleaser.yaml builds for a tag. macOS is Apple Silicon
    # only, for the reason given there. CGO_ENABLED=0 makes every one of these a
    # cross-compile the runner can do on its own.
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_arch: x86_64
          - goos: linux
            goarch: arm64
            asset_arch: arm64
          - goos: darwin
            goarch: arm64
            asset_arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o gog ./main.go
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      # Named and laid out like the archives goreleaser publishes for a tag, so
      # what installs a tagged release installs a dev one by changing the URL
      # and nothing else. An asset whose name does not carry its platform is one
      # a consumer has to be told about out of band.
      - name: Archive
        run: |
          tar -czf gog_${{ matrix.goos }}_${{ matrix.asset_arch }}.tar.gz \
              gog LICENSE README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gog_${{ matrix.goos }}_${{ matrix.asset_arch }}
          path: gog_${{ matrix.goos }}_${{ matrix.asset_arch }}.tar.gz

  # A matrix leg reports as `build-platform (linux, amd64, x86_64)`, a name that
  # changes whenever the matrix does, and a required check that stops reporting
  # blocks every pull request forever. This job reports under one stable name,
  # so branch protection has a single check to require no matter how the matrix
  # grows.
  #
  # `always()` and not `!cancelled()`, which looks tidier and is a hole: a
  # cancelled run would skip this job, and GitHub counts a skipped required
  # check as passing, so an unverified commit becomes mergeable. Failing closed
  # costs a red check on runs that were cancelled anyway.
  build:
    name: Build
    needs: build-platform
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check that every platform built
        run: '[ "${{ needs.build-platform.result }}" = success ]'

  goreleaser:
    needs: [build, test, attributions]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dev-release:
    needs: [build, test, attributions]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Matched by name, not merged blindly: `files: artifacts/*` publishes
      # whatever lands here, so the coverage artifact the called test workflow
      # uploads would otherwise become a dev-release asset no checksum covers.
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          pattern: gog_*
          merge-multiple: true

      # As goreleaser does for a tag. The consumer can then verify what it
      # fetched, which matters more here than there: `dev` is a moving tag, so a
      # download that straddles a re-cut would otherwise go unnoticed.
      - name: Write checksums
        run: cd artifacts && sha256sum -- *.tar.gz > checksums.txt

      # A release follows its tag, and updating one below does not move the tag
      # GitHub already has, so `dev` has to be repointed here or the release's
      # commit link and source archives would describe an older build than the
      # assets beside them. Unmasked on purpose: a rejected tag push (tag
      # protection, or credentials the checkout did not persist) has to fail
      # the job rather than quietly publish binaries with the wrong commit.
      - name: Move the dev tag to this commit
        run: |
          git tag --force dev
          git push --force origin refs/tags/dev

      # Updated in place rather than deleted and recreated. Deleting first left
      # `dev` a 404 for the length of the upload, and permanently if the run
      # died in between; every asset name here is deterministic, so each upload
      # replaces its predecessor and nothing from the previous cut survives.
      - name: Publish dev release
        uses: softprops/action-gh-release@v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: dev
          name: dev
          body: Latest build from main branch
          make_latest: "false"
          files: artifacts/*
